name: Build and deploy ChalkBox preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview repository
        uses: actions/checkout@v4

      - name: Extract Claude integration source
        run: unzip -q ChalkBox_GitHubPages_Preview_Source.zip

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: chalkbox/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: chalkbox
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: chalkbox
        run: pnpm test

      - name: Typecheck
        working-directory: chalkbox
        run: pnpm typecheck

      - name: Build GitHub Pages preview
        working-directory: chalkbox
        run: pnpm build

      - name: Adapt bundled E2E specs to GitHub Pages hash routes
        if: github.event_name == 'pull_request'
        working-directory: chalkbox
        run: |
          sed -i 's#page.goto("/")#page.goto("/chalkbox-claude-preview/")#g' tests/e2e/*.spec.ts
          sed -i 's#page.goto("/demo")#page.goto("/chalkbox-claude-preview/#/demo")#g' tests/e2e/*.spec.ts
          sed -i 's#page.goto("/privacy")#page.goto("/chalkbox-claude-preview/#/privacy")#g' tests/e2e/*.spec.ts
          sed -i 's#page.goto("/app/settings")#page.goto("/chalkbox-claude-preview/#/app/settings")#g' tests/e2e/*.spec.ts
          sed -i 's#"**/app"#"**/#/app"#g' tests/e2e/*.spec.ts
          sed -i 's#"**/plans/**"#"**/#/app/plans/**"#g' tests/e2e/*.spec.ts

      - name: Install Playwright Chromium for browser verification
        if: github.event_name == 'pull_request'
        working-directory: chalkbox
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser E2E tests
        if: github.event_name == 'pull_request'
        timeout-minutes: 4
        working-directory: chalkbox
        run: pnpm exec playwright test --timeout=15000 --retries=0 --workers=4

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: chalkbox/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
